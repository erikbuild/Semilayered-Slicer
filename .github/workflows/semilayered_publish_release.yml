name: Semilayered publish release

# When a "Build all" run on main finishes, publish its installers as a GitHub Release, provided
# nothing failed beyond upstream's known failures and every installer was built.
# The run is started by semilayered_build_on_push.yml; runs on other branches, and runs that were
# not started as a workflow dispatch, publish nothing.
on:
  workflow_run:
    workflows: ["Build all"]
    types: [completed]

permissions:
  contents: write # create the release and its tag
  actions: read # read the run's jobs, logs and artifacts

jobs:
  publish:
    name: Publish release
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      BUILD: ${{ github.event.workflow_run.run_number }}
      BUILT_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Only the release tooling and the version are needed, from the commit that was built.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: 'false'
          sparse-checkout: |
            /semilayered/
            /version.inc
          sparse-checkout-cone-mode: false

      # A re-run of a build that was already published must not publish it again.
      - name: Stop if this build was already released
        run: |
          tag=$(python3 -m semilayered.release tag --build "$BUILD")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists, so this build was already published."
            exit 1
          fi

      - name: Judge the run against the known-failure list
        run: python3 -m semilayered.release gate --run "$RUN_ID"

      - name: Download the installers
        run: |
          names=()
          while read -r artifact; do names+=(--name "$artifact"); done < <(python3 -m semilayered.release artifacts)
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts "${names[@]}"

      - name: Collect the release's files
        run: python3 -m semilayered.release collect --artifacts artifacts --out release

      - name: Check the name in the Linux build's desktop entry
        run: |
          appimage=$(ls release/*_Ubuntu2404_V*.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract '*.desktop' > /dev/null
          grep -qx 'Name=Semilayered Slicer' squashfs-root/*.desktop

      - name: Write the release notes
        run: python3 -m semilayered.release notes --build "$BUILD" > notes.md

      - name: Publish the release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$BUILT_COMMIT" \
            --title "$(python3 -m semilayered.release title --build "$BUILD")" \
            --notes-file notes.md release/*
